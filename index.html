<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cümle Atölyesi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--sf:#fff;--ink:#16203a;--mu:#5b6784;--ln:#d4dae6;--mark:#ffd23f;--mk:#3a2c00;--ok:#1f7a4d;--okb:#dff3e8;--bad:#b3261e;--badb:#fbe6e4;--ac:#2b4acb;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--sf:#182038;--ink:#e8ecf8;--mu:#9aa5c4;--ln:#2b3556;--ok:#6fdca2;--okb:#16382b;--bad:#ff9a92;--badb:#3d1f1d;--ac:#8fa6ff;--on:#0f1426;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1426;--sf:#182038;--ink:#e8ecf8;--mu:#9aa5c4;--ln:#2b3556;--ok:#6fdca2;--okb:#16382b;--bad:#ff9a92;--badb:#3d1f1d;--ac:#8fa6ff;--on:#0f1426;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:24px 18px 48px}
h1,h2,button,.f{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:clamp(30px,6vw,42px);margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:15px;font-weight:500;color:var(--mu);margin:22px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.pill{display:flex;gap:14px;font-size:15px;font-weight:700}.pill span{background:var(--sf);border:1.5px solid var(--ln);border-radius:999px;padding:4px 12px}
.card{background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:20px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--ln);background:transparent;color:var(--ink);padding:8px 15px;border-radius:999px;font-size:15px;cursor:pointer}
.opt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer;background:var(--ac);color:var(--on);width:100%;margin-top:20px}
.btn.gh{background:transparent;color:var(--ink);border:1.5px solid var(--ln);font-weight:500;margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:22px}.bar i{display:block;height:100%;width:0;background:var(--mark);transition:width .35s}
.task{color:var(--mu);font-size:15px;margin:0 0 6px}
.tr{font-size:26px;line-height:1.3;margin:0 0 18px}
.line{min-height:62px;border-bottom:2px solid var(--ln);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:6px}
.line+.line{margin-bottom:18px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.t{font-size:19px;font-weight:600;background:var(--sf);color:var(--ink);border:1.5px solid var(--ln);border-bottom-width:4px;border-radius:10px;padding:8px 14px;cursor:pointer}
.t:active{transform:translateY(2px);border-bottom-width:2px}
.t.empty{visibility:hidden}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;display:none}
.fb.ok{display:block;background:var(--okb);color:var(--ok)}.fb.no{display:block;background:var(--badb);color:var(--bad)}
.fb b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:18px}
.fb .ans{color:var(--ink);font-style:italic;font-size:20px;margin:4px 0}
.fb .nt{color:var(--ink);font-size:16px;margin-top:6px}
.listen{border:0;background:none;color:var(--ac);font-size:15px;cursor:pointer;padding:2px 0}
.big{font-size:56px;font-weight:800;line-height:1}
.wl{list-style:none;padding:0;margin:0}.wl li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--ln)}
.wl li span:last-child{color:var(--mu)}
.vw{font-size:clamp(34px,9vw,52px);font-weight:800;font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:4px 0 24px;line-height:1.1}
.vo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.vo{grid-template-columns:1fr}}
.o{font-size:18px;font-weight:600;background:var(--sf);color:var(--ink);border:1.5px solid var(--ln);border-bottom-width:4px;border-radius:12px;padding:16px 12px;cursor:pointer}
.o.c{background:var(--okb);color:var(--ok);border-color:var(--ok)}.o.w{background:var(--badb);color:var(--bad);border-color:var(--bad)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.mg .btn{margin:0;font-size:15px;padding:14px 8px}
.t.c{background:var(--okb);color:var(--ok);border-color:var(--ok)}.t.w{background:var(--badb);color:var(--bad);border-color:var(--bad)}
.ta{width:100%;min-height:110px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:19px;padding:12px}
.err{color:var(--bad);font-size:15px;margin:12px 0 0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Cümle Atölyesi</h1><div class="pill f"><button class="opt hide" id="hm">Ana ekran</button><span id="xp">0 XP</span><span id="st">0 gün</span></div></div>

<section id="home" class="card">
  <div id="gd"></div>
  <h2>Seviye</h2>
  <div class="opts" id="lv"></div>
  <h2>Konu</h2>
  <div class="opts" id="tp"></div>
  <div class="mg">
  <button class="btn" id="go">Cümle kur</button>
  <button class="btn" id="gl">Dinle ve kur</button>
  <button class="btn" id="gf">Boşluk doldur</button>
  <button class="btn" id="ge">Hata bul</button>
  <button class="btn" id="gv" style="background:var(--mark);color:var(--mk)">Kelime oyunu</button>
  <button class="btn" id="gt" style="background:var(--mark);color:var(--mk)">60 sn hızlı mod</button>
  <button class="btn gh" id="gs">Tekrar</button>
  <button class="btn gh" id="gj">Yazma günlüğü</button>
  <button class="btn gh" id="gr">Zayıf yönler</button>
  </div>
  <button class="btn gh" id="nb">Kelime defterim (<span id="nc">0</span>)</button>
  <p class="err" id="herr"></p>
</section>

<section id="book" class="card hide">
  <h2 style="margin-top:0">Kelime defterim</h2><ul class="wl" id="wl"></ul>
  <button class="btn gh" id="bk">Geri dön</button>
</section>

<section id="lesson" class="hide">
  <div class="bar"><i id="pg"></i></div>
  <p class="task">Bu cümleyi İngilizce kur</p>
  <p class="tr" id="tr"></p>
  <div class="line" id="l1"></div><div class="line" id="l2"></div>
  <div class="pool" id="pool"></div>
  <div class="fb" id="fb"></div>
  <button class="btn" id="chk" disabled>Kontrol et</button>
</section>

<section id="vocab" class="hide">
  <div class="bar"><i id="vpg"></i></div>
  <p class="task" id="vlab"></p>
  <p class="vw" id="vq"></p>
  <div class="vo" id="vo"></div>
  <p class="task" id="vcb" style="text-align:center;margin-top:16px;min-height:24px"></p>
</section>

<section id="qz" class="hide">
  <div class="bar"><i id="qpg"></i></div>
  <p class="task" id="qlab"></p><p class="tr" id="qq"></p>
  <div id="qo"></div><div class="fb" id="qfb"></div>
  <button class="btn hide" id="qn">Devam</button>
</section>

<section id="jr" class="card hide">
  <h2 style="margin-top:0">Bugünün sorusu</h2><p class="tr" id="jp" style="font-size:22px"></p>
  <textarea class="ta" id="jt" placeholder="İngilizce cevabını yaz…" spellcheck="false"></textarea>
  <button class="btn" id="jsend">Gönder</button><div id="jres"></div>
</section>

<section id="rp" class="card hide">
  <h2 style="margin-top:0">Zayıf yönlerin</h2><div id="rl"></div>
  <button class="btn" id="rs"></button>
</section>

<section id="done" class="card hide" style="text-align:center">
  <div class="big" id="dsc"></div><p id="dmsg"></p>
  <h2>Bu derste öğrendiklerin</h2><ul class="wl" style="text-align:left" id="dw"></ul>
  <button class="btn" id="again">Yeni ders</button>
</section>
</main>

<script>
/* Claude yerine kendi sunucu fonksiyonuna (Gemini) bağlanan köprü */
window.claude={use:async n=>n==="sample"?{json:async p=>{const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p})});if(!r.ok)throw {code:"error"};return r.json()}}:null};
</script>
<script>
const $=id=>document.getElementById(id), show=n=>{["home","book","lesson","vocab","qz","jr","rp","done"].forEach(x=>$(x).classList.toggle("hide",x!==n));if(n==="home")renderHome();$("hm").classList.toggle("hide",n==="home")};
const LV=["A1","A2","B1","B2"], TP=["Karışık","Geçmiş zaman","Gelecek zaman","Soru kurma","If cümleleri","Edilgen yapı","Günlük konuşma"];
const FALL=[
{en:"I forgot my keys at home.",tr:"Anahtarlarımı evde unuttum.",extra:["forget","my"],note:"Geçmiş zamanda forget düzensizdir: forget → forgot.",words:[{en:"forget",tr:"unutmak"}]},
{en:"She has lived here for five years.",tr:"Beş yıldır burada yaşıyor.",extra:["lives","since"],note:"Süre bildiren for ile Present Perfect (has + V3) kullanılır.",words:[{en:"for",tr:"-dir, süresince"}]},
{en:"Where did you buy that jacket?",tr:"O ceketi nereden aldın?",extra:["do","bought"],note:"Did’den sonra fiil yalın halde kalır: buy, bought değil.",words:[{en:"jacket",tr:"ceket"}]},
{en:"If it rains, we will stay home.",tr:"Yağmur yağarsa evde kalırız.",extra:["would","rained"],note:"Gerçek ihtimalde if kısmı Present Simple, sonuç kısmı will ile kurulur.",words:[{en:"stay",tr:"kalmak"}]},
{en:"The window was broken by the children.",tr:"Pencere çocuklar tarafından kırıldı.",extra:["break","is"],note:"Edilgen yapı: was/were + V3. Yapan kişi by ile söylenir.",words:[{en:"broken",tr:"kırık"}]},
{en:"I am going to visit my grandmother tomorrow.",tr:"Yarın büyükannemi ziyaret edeceğim.",extra:["will","visiting"],note:"Planlanmış niyet için be going to + yalın fiil kullanılır.",words:[{en:"visit",tr:"ziyaret etmek"}]}];
let S={lv:1,tp:0,xp:0,st:0,last:"",book:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("ca2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ca2",JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
function head(){if(S.dd!==today()){S.dd=today();S.dx=0}S.dx=(S.dx||0)+(S.lx==null?0:Math.max(0,S.xp-S.lx));S.lx=S.xp;$("xp").textContent=S.xp+" XP";$("st").textContent=S.st+" gün";$("nc").textContent=S.book.length}
function opts(el,arr,key){el.innerHTML=arr.map((a,i)=>'<button class="opt" data-i="'+i+'" aria-pressed="'+(S[key]===i)+'">'+a+'</button>').join("");
 el.onclick=e=>{const b=e.target.closest("button");if(!b)return;S[key]=+b.dataset.i;save();opts(el,arr,key)}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let Q=[],i=0,ok=0,newW=[],tiles=[],placed=[],checked=false,busy=false;

$("go").onclick=async()=>{
  if(busy)return;LM=lmNext;lmNext=false;busy=true;$("go").disabled=true;$("go").textContent="Ders hazırlanıyor…";$("herr").textContent="";
  let q=null;
  try{
    const s=await claude.use("sample");
    if(s){
      q=await s.json("Create 6 'build the sentence' exercises for a Turkish speaker learning English. Level: "+LV[S.lv]+" (CEFR). Grammar focus: "+(S.tp?TP[S.tp]:"mixed everyday topics")+". Each English sentence must be 4-10 words, natural, with one clearly correct word order. Return ONLY a JSON array of 6 objects: {\"en\": English sentence, \"tr\": Turkish translation, \"extra\": array of exactly 2 plausible wrong distractor words (single words, e.g. a wrong tense form), \"note\": one short Turkish grammar tip about this sentence, \"words\": array of 1-2 objects {\"en\",\"tr\"} for the most useful vocabulary}.",{modelTier:"quick",cache:false});
      if(!Array.isArray(q)||!q.length||!q.every(x=>x&&x.en&&x.tr))q=null;
    }
  }catch(e){q=null}
  if(!q){q=shuf(FALL);$("herr").textContent=""}
  Q=q;i=0;ok=0;newW=[];busy=false;$("go").disabled=false;$("go").textContent="Cümle kur";
  show("lesson");load();
};

function load(){
  checked=false;const x=Q[i];
  const core=x.en.replace(/[.?!]+$/,"").split(/\s+/);
  tiles=shuf(core.concat((x.extra||[]).slice(0,2)).map((t,k)=>({id:k,t})));placed=[];
  $("tr").textContent=LM?"🔊 Dokun ve dinle":x.tr;if(LM)speak(x.en);$("fb").className="fb";$("pg").style.width=(i/Q.length*100)+"%";
  $("chk").textContent="Kontrol et";draw();
}
function draw(){
  const chip=(o,w)=>'<button class="t" data-id="'+o.id+'" data-w="'+w+'">'+esc(o.t)+'</button>';
  $("l1").innerHTML=placed.map(o=>chip(o,"p")).join("");
  $("pool").innerHTML=tiles.map(o=>placed.includes(o)?'<button class="t empty" disabled>'+esc(o.t)+'</button>':chip(o,"s")).join("");
  $("chk").disabled=!placed.length&&!checked;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".t");if(!b||checked||!b.dataset.id)return;
  const o=tiles.find(t=>t.id==b.dataset.id);
  if(b.dataset.w==="s")placed.push(o);else placed=placed.filter(p=>p!==o);
  draw();
});
const norm=s=>s.toLowerCase().replace(/[^a-z0-9’' ]/g,"").replace(/\s+/g," ").trim();

$("chk").onclick=()=>{
  const x=Q[i];
  if(checked){i++;if(i<Q.length)load();else finish();return}
  checked=true;
  const good=norm(placed.map(p=>p.t).join(" "))===norm(x.en);
  rec(TP[S.tp]!=="Karışık"?TP[S.tp]:"Cümle kurma",good);if(good){ok++;S.xp+=10}
  (x.words||[]).forEach(w=>{if(w&&w.en&&!newW.some(n=>n.en===w.en))newW.push(w)});
  $("fb").className="fb "+(good?"ok":"no");
  $("fb").innerHTML="<b>"+(good?"Doğru! +10 XP":"Olmadı, doğrusu şu:")+"</b><div class=\"ans\">"+esc(x.en)+"</div><button class=\"listen\" id=\"ls\">▶ Dinle</button>"+(x.note?"<div class=\"nt\">"+esc(x.note)+"</div>":"");
  $("ls").onclick=()=>{try{const u=new SpeechSynthesisUtterance(x.en);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
  $("chk").textContent=i+1<Q.length?"Devam":"Bitir";$("chk").disabled=false;
  $("pg").style.width=((i+1)/Q.length*100)+"%";head();save();
};

function finish(){
  const t=today();
  if(S.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.st=S.last===y?S.st+1:1;S.last=t}
  newW.forEach(w=>{if(!S.book.some(b=>b.en===w.en))S.book.push(w)});
  save();head();
  $("dsc").textContent=ok+"/"+Q.length;
  $("dmsg").textContent=ok===Q.length?"Hatasız bir ders, harika.":ok>=Q.length/2?"İyi gidiyorsun, yanlışlara not düşmeyi unutma.":"Zorlandın ama bu normal. Notları okuyup yeni derse geç.";
  $("dw").innerHTML=newW.map(w=>"<li><span>"+esc(w.en)+"</span><span>"+esc(w.tr)+"</span></li>").join("");
  show("done");
}
$("again").onclick=()=>show("home");

const VF=[{en:"borrow",tr:"ödünç almak"},{en:"crowded",tr:"kalabalık"},{en:"neighbor",tr:"komşu"},{en:"improve",tr:"geliştirmek"},{en:"avoid",tr:"kaçınmak"},{en:"reliable",tr:"güvenilir"},{en:"delay",tr:"ertelemek"},{en:"suggest",tr:"önermek"},{en:"quiet",tr:"sessiz"},{en:"journey",tr:"yolculuk"},{en:"hesitate",tr:"tereddüt etmek"},{en:"genuine",tr:"gerçek, samimi"},{en:"overcome",tr:"üstesinden gelmek"},{en:"patient",tr:"sabırlı"}];
let V=[],AW=[],vi=0,vok=0,vmiss=[],vcb=0,vlock=false;
const dedupe=a=>{const s={};return a.filter(x=>x&&x.en&&x.tr&&!s[x.en.toLowerCase()]&&(s[x.en.toLowerCase()]=1))};
$("gv").onclick=async()=>{
  if(busy)return;busy=true;$("gv").disabled=true;$("gv").textContent="Hazırlanıyor…";
  let w=null;
  try{const s=await claude.use("sample");if(s){w=await s.json("List 8 useful English words for a Turkish learner at CEFR level "+LV[S.lv]+", varied parts of speech. Return ONLY a JSON array of {\"en\": word, \"tr\": short Turkish meaning}.",{modelTier:"quick",cache:false});if(!Array.isArray(w)||w.length<4)w=null}}catch(e){w=null}
  const base=w||shuf(VF).slice(0,8);
  V=dedupe(base.concat(shuf(S.book).slice(0,2))).slice(0,10);AW=dedupe(V.concat(S.book,VF));
  vi=0;vok=0;vmiss=[];vcb=0;busy=false;$("gv").disabled=false;$("gv").textContent="Kelime oyunu";
  show("vocab");vload();if(TM)startTimer();
};
function vload(){
  vlock=false;const x=V[vi],dir=Math.random()<.5,key=dir?"en":"tr",cor=x[key];
  const ds=shuf(AW.filter(o=>o.en!==x.en&&o[key]!==cor)).slice(0,3);
  $("vlab").textContent=dir?"Hangi İngilizce kelime?":"Türkçe anlamı ne?";
  $("vq").textContent=dir?x.tr:x.en;
  $("vo").innerHTML=shuf([cor].concat(ds.map(o=>o[key]))).map(t=>'<button class="o" data-v="'+esc(t)+'">'+esc(t)+'</button>').join("");
  $("vo").dataset.cor=cor;$("vpg").style.width=(vi/V.length*100)+"%";
  $("vcb").textContent=vcb>1?"Seri: "+vcb+" doğru üst üste":"";
}
$("vo").onclick=e=>{
  const b=e.target.closest(".o");if(!b||vlock)return;vlock=true;
  const cor=$("vo").dataset.cor,x=V[vi],good=b.dataset.v===cor;rec("Kelime bilgisi",good);srs(x,good);
  document.querySelectorAll(".o").forEach(o=>{if(o.dataset.v===cor)o.classList.add("c")});
  if(good){vok++;vcb++;S.xp+=10+Math.min(vcb-1,3)*2}else{vcb=0;b.classList.add("w");if(!vmiss.some(m=>m.en===x.en))vmiss.push(x)}
  try{const u=new SpeechSynthesisUtterance(x.en);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(er){}
  head();save();$("vpg").style.width=((vi+1)/V.length*100)+"%";
  setTimeout(()=>{if($("vocab").classList.contains("hide"))return;vi++;if(TM&&vi>=V.length){V=shuf(V);vi=0}if(vi<V.length)vload();else vfinish()},TM?(good?400:900):(good?800:1600));
};
function vfinish(){clearInterval(VT);const tm=TM;TM=false;bump();
  vmiss.forEach(w=>{if(!S.book.some(b=>b.en===w.en))S.book.push(w)});save();head();
  $("dsc").textContent=tm?vok+" doğru":vok+"/"+V.length;
  $("dmsg").textContent=vmiss.length?"Yanlış yaptığın kelimeler kelime defterine eklendi, bir sonraki oyunda yine karşına çıkacaklar.":"Hepsini bildin, harika.";
  $("dw").innerHTML=vmiss.length?vmiss.map(w=>"<li><span>"+esc(w.en)+"</span><span>"+esc(w.tr)+"</span></li>").join(""):"<li><span>Yanlış kelime yok</span></li>";
  show("done");
}
$("nb").onclick=()=>{$("wl").innerHTML=S.book.length?S.book.map(w=>"<li><span>"+esc(w.en)+"</span><span>"+esc(w.tr)+"</span></li>").join(""):"<li><span>Henüz kelime yok. İlk dersi bitir.</span></li>";show("book")};
$("bk").onclick=()=>show("home");
let LM=false,lmNext=false,TM=false,VT=0,TL=60,QZ=[],qi=0,qok=0,qk='',qlk=false,qmiss=[],weak='';
const isDue=w=>!w.d||w.d<=today();
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
function rec(t,g){S.ws=S.ws||{};const o=S.ws[t]||(S.ws[t]={ok:0,n:0});o.n++;if(g)o.ok++}
function srs(x,g){const b=S.book.find(w=>w.en===x.en);if(!b)return;b.b=g?Math.min((b.b||0)+1,4):0;b.d=new Date(Date.now()+(g?[1,2,4,8,16][b.b]:0)*864e5).toISOString().slice(0,10)}
function bump(){const t=today();if(S.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.st=S.last===y?S.st+1:1;S.last=t}}
$('tr').onclick=()=>{if(LM)speak(Q[i].en)};
$('hm').onclick=()=>{clearInterval(VT);TM=false;try{speechSynthesis.cancel()}catch(e){}show('home')};
function renderHome(){const g=Math.min(S.dx||0,30),B=[['İlk adım',S.xp>=10],['100 XP',S.xp>=100],['500 XP',S.xp>=500],['3 gün seri',S.st>=3],['7 gün seri',S.st>=7],['20 kelime',S.book.length>=20]];$('gd').innerHTML='<p class="task" style="margin:0 0 6px">Bugünkü hedef: '+g+' / 30 XP'+(g>=30?' ✓':'')+'</p><div class="bar" style="margin-bottom:12px"><i style="width:'+g/30*100+'%"></i></div><div class="opts" style="margin-bottom:6px">'+B.map(b=>'<span class="opt" style="'+(b[1]?'background:var(--mark);color:var(--mk);border-color:var(--mark)':'opacity:.45')+'">'+b[0]+'</span>').join('')+'</div>';$('gs').textContent='Tekrar ('+S.book.filter(isDue).length+')'}
$('gl').onclick=()=>{lmNext=true;$('go').click()};
$('gt').onclick=()=>{TM=true;$('gv').click()};
function startTimer(){clearInterval(VT);TL=60;VT=setInterval(()=>{TL-=.25;$('vpg').style.width=Math.max(TL,0)/60*100+'%';$('vcb').textContent='Kalan: '+Math.max(Math.ceil(TL),0)+' sn'+(vcb>1?' · Seri '+vcb:'');if(TL<=0)vfinish()},250)}
$('gs').onclick=()=>{const d=S.book.filter(isDue);if(d.length<4){$('herr').textContent='Tekrar için en az 4 kelime gerekli. Kelime oyunu oynayıp defterini doldur.';return}$('herr').textContent='';V=shuf(d).slice(0,10);AW=dedupe(V.concat(S.book,VF));vi=0;vok=0;vmiss=[];vcb=0;show('vocab');vload()};
const FQ=[{s:'She ___ to school yesterday.',opts:['went','goes','go'],a:'went',note:'Yesterday geçmiş zaman işaretidir: go → went.',topic:'Geçmiş zaman'},{s:'If I ___ rich, I would travel the world.',opts:['were','am','will be'],a:'were',note:'Gerçek dışı if cümlesinde if kısmında geçmiş zaman (were) kullanılır.',topic:'If cümleleri'},{s:'The letter ___ by my brother.',opts:['was written','wrote','has write'],a:'was written',note:'Edilgen yapı: was/were + V3.',topic:'Edilgen yapı'}];
const FE=[{w:['He','don’t','like','coffee.'],i:1,fix:'He doesn’t like coffee.',note:'He/she/it ile olumsuzda doesn’t kullanılır.',topic:'Günlük konuşma'},{w:['Did','you','went','to','the','party?'],i:2,fix:'Did you go to the party?',note:'Did’den sonra fiil yalın kalır.',topic:'Geçmiş zaman'},{w:['I','will','to','call','you','tomorrow.'],i:2,fix:'I will call you tomorrow.',note:'will’den sonra to gelmez.',topic:'Gelecek zaman'}];
async function startQz(k,btn){
 if(busy)return;busy=true;const t=btn.textContent,f=k==='f';btn.disabled=true;btn.textContent='Hazırlanıyor…';let q=null;
 const tp='exactly one of: '+TP.slice(1).join(', ');
 try{const s=await claude.use('sample');if(s){q=await s.json(f?'Create 6 fill-in-the-blank grammar exercises for a Turkish speaker learning English, CEFR '+LV[S.lv]+'. Return ONLY a JSON array of objects with keys: s (English sentence containing ___ once), opts (array of 3 options), a (the correct option, must be one of opts), note (short Turkish grammar explanation), topic ('+tp+').':'Create 6 find-the-mistake exercises for a Turkish speaker learning English, CEFR '+LV[S.lv]+'. Return ONLY a JSON array of objects with keys: w (array of the words of one English sentence that has exactly ONE grammar mistake, punctuation attached to the last word), i (index of the wrong word in w), fix (the corrected full sentence), note (short Turkish explanation of the mistake), topic ('+tp+').',{modelTier:'quick',cache:false});if(!Array.isArray(q)||!q.length||!q.every(x=>f?x&&x.s&&x.a&&Array.isArray(x.opts)&&x.opts.includes(x.a):x&&Array.isArray(x.w)&&Number.isInteger(x.i)&&x.w[x.i]&&x.fix))q=null}}catch(e){q=null}
 QZ=q||shuf(f?FQ:FE);qk=k;qi=0;qok=0;qmiss=[];busy=false;btn.disabled=false;btn.textContent=t;show('qz');qload()}
$('gf').onclick=()=>startQz('f',$('gf'));$('ge').onclick=()=>startQz('e',$('ge'));
function qload(){qlk=false;const x=QZ[qi],f=qk==='f';$('qlab').textContent=f?'Boşluğa uyan seçeneği seç':'Hatalı kelimeye dokun';$('qq').textContent=f?x.s:'';$('qo').className=f?'vo':'pool';$('qo').innerHTML=(f?shuf(x.opts):x.w).map((t,j)=>'<button class="'+(f?'o':'t')+'" data-j="'+j+'" data-v="'+esc(t)+'">'+esc(t)+'</button>').join('');$('qfb').className='fb';$('qn').classList.add('hide');$('qpg').style.width=(qi/QZ.length*100)+'%'}
$('qo').onclick=e=>{const b=e.target.closest('button');if(!b||qlk)return;qlk=true;const x=QZ[qi],f=qk==='f',good=f?b.dataset.v===x.a:+b.dataset.j===x.i,fx=f?x.s.replace('___',x.a):x.fix;
 document.querySelectorAll('#qo button').forEach((o,j)=>{if(f?o.dataset.v===x.a:j===x.i)o.classList.add('c');else if(o===b)o.classList.add('w')});
 if(good){qok++;S.xp+=10}else qmiss.push(fx);rec(x.topic||'Gramer',good);
 $('qfb').className='fb '+(good?'ok':'no');$('qfb').innerHTML='<b>'+(good?'Doğru! +10 XP':'Olmadı')+'</b>'+(good?'':'<div class="ans">'+esc(fx)+'</div>')+(x.note?'<div class="nt">'+esc(x.note)+'</div>':'');
 $('qn').textContent=qi+1<QZ.length?'Devam':'Bitir';$('qn').classList.remove('hide');head();save()};
$('qn').onclick=()=>{qi++;if(qi<QZ.length){qload();return}bump();$('dsc').textContent=qok+'/'+QZ.length;$('dmsg').textContent=qmiss.length?'Doğru cümleler aşağıda, her birini bir kez yüksek sesle oku.':'Hepsini bildin, harika.';$('dw').innerHTML=(qmiss.length?qmiss:['Yanlış yok']).map(t=>'<li><span>'+esc(t)+'</span></li>').join('');save();head();show('done')};
const JP=['What did you do yesterday?','Describe your best friend.','What are your plans for the weekend?','What is your favorite food and why?','Tell me about a place you want to visit.','What did you learn this week?','Describe your morning routine.'];
$('gj').onclick=()=>{$('jp').textContent=JP[new Date().getDate()%JP.length];$('jres').innerHTML='';show('jr')};
$('jsend').onclick=async()=>{const t=$('jt').value.trim();if(t.split(/\s+/).length<4){$('jres').innerHTML='<p class="err">En az bir iki cümle yaz.</p>';return}
 if(busy)return;busy=true;$('jsend').disabled=true;$('jsend').textContent='Kontrol ediliyor…';
 try{const s=await claude.use('sample');if(!s)throw 0;const r=await s.json('A Turkish-speaking English learner (CEFR '+LV[S.lv]+') answered the question: '+$('jp').textContent+' Their answer: '+t+'\nReturn ONLY a JSON object with keys: corrected (minimally corrected text), notes (array of up to 4 short Turkish explanations of mistakes, empty if none), score (integer 1-5), tip (one short encouraging Turkish tip).',{modelTier:'quick',cache:false});
  S.xp+=15;bump();rec('Yazma',r.score>=4);save();head();
  $('jres').innerHTML='<h2>Düzeltilmiş hali · '+esc(r.score)+'/5 · +15 XP</h2><p style="font-style:italic;font-size:20px;margin:0">'+esc(r.corrected)+'</p>'+(r.notes&&r.notes.length?'<h2>Açıklama</h2><ul>'+r.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')+(r.tip?'<h2>İpucu</h2><p style="margin:0">'+esc(r.tip)+'</p>':'');
 }catch(e){$('jres').innerHTML='<p class="err">Yapay zeka şu an kullanılamıyor. Birazdan tekrar dene.</p>'}
 busy=false;$('jsend').disabled=false;$('jsend').textContent='Gönder'};
$('gr').onclick=()=>{const r=Object.entries(S.ws||{}).map(([t,o])=>({t,o,p:o.ok/o.n})).sort((a,b)=>a.p-b.p);weak=r.length?r[0].t:'';
 $('rl').innerHTML=r.length?'<ul class="wl">'+r.map(x=>'<li style="display:block"><span style="display:flex;justify-content:space-between;color:var(--ink)"><span>'+esc(x.t)+'</span><span>'+x.o.ok+'/'+x.o.n+'</span></span><div class="bar" style="margin:6px 0 0"><i style="width:'+x.p*100+'%"></i></div></li>').join('')+'</ul>':'<p>Henüz veri yok. Birkaç egzersiz çöz, burada konularına göre başarını göreceksin.</p>';
 $('rs').classList.toggle('hide',!weak);$('rs').textContent=weak?'Zayıf konuyu çalış: '+weak:'';show('rp')};
$('rs').onclick=()=>{const k=TP.indexOf(weak);if(k>0){S.tp=k;opts($('tp'),TP,'tp');save();$('go').click()}else if(weak==='Kelime bilgisi')$('gv').click();else if(weak==='Yazma')$('gj').click();else $('gf').click()};
opts($("lv"),LV,"lv");opts($("tp"),TP,"tp");head();show("home");
</script>
